# Publishes the walk guide to GitHub Pages.
#
# The first successful run also turns Pages on for the repository
# (configure-pages with enablement), so there is nothing to click in
# Settings. If that step is refused, set Settings -> Pages -> Source to
# "GitHub Actions" once by hand and re-run this workflow.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/nsw-parks-hiking-map-6nhy7g]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
